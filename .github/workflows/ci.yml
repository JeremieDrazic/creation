name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundations:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: true
      TURBO_TELEMETRY_DISABLED: 1
      STORYBOOK_DISABLE_TELEMETRY: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - name: Build and verify the serving image
        run: |
          docker build -f deploy/static.Dockerfile --build-arg RELEASE_SHA="$GITHUB_SHA" -t "creation-static:$GITHUB_SHA" .
          bash deploy/release.test.sh
          bash deploy/smoke-test.sh "creation-static:$GITHUB_SHA"
          docker save "creation-static:$GITHUB_SHA" | gzip > "$RUNNER_TEMP/creation-image.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: creation-image
          path: ${{ runner.temp }}/creation-image.tar.gz
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
